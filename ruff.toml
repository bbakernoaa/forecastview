target-version = "py312"
line-length = 100

[lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in default args (FastAPI pattern)
    "B904",   # raise from in except (noisy with HTTPException pattern)
    "SIM102", # nested if (sometimes clearer)
    "SIM108", # ternary suggestion
]

[lint.per-file-ignores]
"backend/run.py" = ["E402"]  # import not at top (sys.path manipulation)
"backend/scripts/*" = ["E402"]  # scripts modify path before imports

[lint.isort]
known-first-party = ["backend"]

[format]
quote-style = "double"
indent-style = "space"
