# Air Composition Domain Configuration
# Defines variable metadata, categories, and rendering hints for the
# GEFS Aerosol Component (GEFS-Aerosols) forecast product.

product:
  name: "GEFS-Aerosol"
  id: "air"

categories:
  - "Optical Depth"
  - "Scattering Optical Depth"
  - "Single Scattering Albedo"
  - "Asymmetry"
  - "Column Mass Density"

variables:
  # ===================================================================
  # Optical Depth
  # ===================================================================
  totAOD550:
    shortName: "totAOD550"
    fullName: "Total Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "afmhot_r"
      contourInterval: 0.1
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  duAOD550:
    shortName: "duAOD550"
    fullName: "Dust Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "YlOrBr"
      contourInterval: 0.1
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  ssAOD550:
    shortName: "ssAOD550"
    fullName: "Sea Salt Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "Blues"
      contourInterval: 0.05
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  omAOD550:
    shortName: "omAOD550"
    fullName: "Organic Matter Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "Greens"
      contourInterval: 0.05
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  bcAOD550:
    shortName: "bcAOD550"
    fullName: "Black Carbon Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "Greys"
      contourInterval: 0.01
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  totAOD340:
    shortName: "totAOD340"
    fullName: "Total Aerosol Optical Depth at 340nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "rainbow"
      contourInterval: 0.1
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  totAOD440:
    shortName: "totAOD440"
    fullName: "Total Aerosol Optical Depth at 440nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "rainbow"
      contourInterval: 0.1
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  totAOD645:
    shortName: "totAOD645"
    fullName: "Total Aerosol Optical Depth at 645nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "rainbow"
      contourInterval: 0.1
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  totAOD870:
    shortName: "totAOD870"
    fullName: "Total Aerosol Optical Depth at 870nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "rainbow"
      contourInterval: 0.1
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  totAOD1640:
    shortName: "totAOD1640"
    fullName: "Total Aerosol Optical Depth at 1640nm"
    units: "Numeric"
    category: "Optical Depth"
    rendering:
      colormap: "rainbow"
      contourInterval: 0.05
      fillLevels: [0.05, 0.1, 0.2, 0.3, 0.5, 0.6, 0.7, 0.8, 0.9, 1.0, 1.25, 1.5, 2.0]

  totAOD11100:
    shortName: "totAOD11100"
