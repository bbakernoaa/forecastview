  # ===================================================================
  # Column Mass Density
  # ===================================================================
  tot_pm10_colmd:
    shortName: "tot_pm10_colmd"
    fullName: "Total PM10 Column Mass Density"
    units: "kg m-2"
    category: "Column Mass Density"
    rendering:
      colormap: "hot_r"
      contourInterval: 0.0001
      fillLevels: [0, 0.0001, 0.0002, 0.0005, 0.001, 0.002, 0.005, 0.01, 0.02, 0.05]

  tot_pm25_colmd:
