  ssScatAOD550:
    shortName: "ssScatAOD550"
    fullName: "Sea Salt Scattering Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Scattering Optical Depth"
    rendering:
      colormap: "Blues"
      contourInterval: 0.05
      fillLevels: [0, 0.05, 0.1, 0.15, 0.2, 0.3, 0.5, 0.7, 1.0, 1.5]

  so4ScatAOD550:
    shortName: "so4ScatAOD550"
    fullName: "Sulfate Scattering Aerosol Optical Depth at 550nm"
    units: "Numeric"
    category: "Scattering Optical Depth"
    rendering:
