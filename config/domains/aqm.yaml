# AQMv7 Air Quality Model Domain Configuration
# CONUS domain (Lambert Conformal, 5km resolution)
# Data source: s3://noaa-nws-naqfc-pds/AQMv7/CS/

product:
  name: "AQMv7"
  id: "aqm"

grid:
  projection: "lambert_conformal"
  domain: "CONUS"
  resolution_km: 5.079
  nx: 1473
  ny: 1025
  # Lambert Conformal parameters
  lat1: 12.19
  lon1: -133.459
  latin1: 25.0
  latin2: 25.0
  lov: -95.0

categories:
  - "Ozone"
  - "Particulate Matter"

variables:
  # ===================================================================
  # Ozone
  # ===================================================================
  ave_1hr_o3:
    shortName: "ave_1hr_o3"
    fullName: "1-Hour Average Ozone"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  ave_8hr_o3:
    shortName: "ave_8hr_o3"
    fullName: "8-Hour Average Ozone"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  max_1hr_o3:
    shortName: "max_1hr_o3"
    fullName: "Daily Maximum 1-Hour Ozone"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  max_8hr_o3:
    shortName: "max_8hr_o3"
    fullName: "Daily Maximum 8-Hour Ozone"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  # Bias-corrected variants
  ave_1hr_o3_bc:
    shortName: "ave_1hr_o3_bc"
    fullName: "1-Hour Average Ozone (Bias Corrected)"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  ave_8hr_o3_bc:
    shortName: "ave_8hr_o3_bc"
    fullName: "8-Hour Average Ozone (Bias Corrected)"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  max_1hr_o3_bc:
    shortName: "max_1hr_o3_bc"
    fullName: "Daily Maximum 1-Hour Ozone (Bias Corrected)"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  max_8hr_o3_bc:
    shortName: "max_8hr_o3_bc"
    fullName: "Daily Maximum 8-Hour Ozone (Bias Corrected)"
    units: "ppbv"
    category: "Ozone"
    rendering:
      colormap: "RdYlGn_r"
      contourInterval: 10
      fillLevels: [0, 10, 20, 30, 40, 50, 60, 70, 80, 100, 120, 150, 200]

  # ===================================================================
  # Particulate Matter
  # ===================================================================
  ave_1hr_pm25:
    shortName: "ave_1hr_pm25"
    fullName: "1-Hour Average PM2.5"
    units: "µg/m³"
    category: "Particulate Matter"
    rendering:
      colormap: "YlOrRd"
      contourInterval: 5
      fillLevels: [0, 5, 10, 15, 20, 25, 35, 50, 75, 100, 150, 200, 300]

  ave_24hr_pm25:
    shortName: "ave_24hr_pm25"
    fullName: "24-Hour Average PM2.5"
    units: "µg/m³"
    category: "Particulate Matter"
    rendering:
      colormap: "YlOrRd"
      contourInterval: 5
      fillLevels: [0, 5, 10, 15, 20, 25, 35, 50, 75, 100, 150, 200, 300]

  max_1hr_pm25:
    shortName: "max_1hr_pm25"
    fullName: "Daily Maximum 1-Hour PM2.5"
    units: "µg/m³"
    category: "Particulate Matter"
    rendering:
      colormap: "YlOrRd"
      contourInterval: 5
      fillLevels: [0, 5, 10, 15, 20, 25, 35, 50, 75, 100, 150, 200, 300]

  # Bias-corrected
  ave_1hr_pm25_bc:
    shortName: "ave_1hr_pm25_bc"
    fullName: "1-Hour Average PM2.5 (Bias Corrected)"
    units: "µg/m³"
    category: "Particulate Matter"
    rendering:
      colormap: "YlOrRd"
      contourInterval: 5
      fillLevels: [0, 5, 10, 15, 20, 25, 35, 50, 75, 100, 150, 200, 300]

  ave_24hr_pm25_bc:
    shortName: "ave_24hr_pm25_bc"
    fullName: "24-Hour Average PM2.5 (Bias Corrected)"
    units: "µg/m³"
    category: "Particulate Matter"
    rendering:
      colormap: "YlOrRd"
      contourInterval: 5
      fillLevels: [0, 5, 10, 15, 20, 25, 35, 50, 75, 100, 150, 200, 300]

  max_1hr_pm25_bc:
    shortName: "max_1hr_pm25_bc"
    fullName: "Daily Maximum 1-Hour PM2.5 (Bias Corrected)"
    units: "µg/m³"
    category: "Particulate Matter"
    rendering:
      colormap: "YlOrRd"
      contourInterval: 5
      fillLevels: [0, 5, 10, 15, 20, 25, 35, 50, 75, 100, 150, 200, 300]
